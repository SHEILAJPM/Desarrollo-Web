spring.application.name=backend

# Conexion a H2 persistente en disco (los datos sobreviven al reiniciar).
# MODE=MySQL mantiene la compatibilidad con el script database/desarrollo_web.sql.
spring.datasource.url=jdbc:h2:file:./data/desarrollo_web;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Para volver a MySQL: comentar el bloque H2 y descomentar este
#spring.datasource.url=jdbc:mysql://localhost:3306/desarrollo_web
#spring.datasource.username=root
#spring.datasource.password=evelin123

# Consola web H2: http://localhost:8080/h2-console  (JDBC URL igual a la de arriba, usuario sa, sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Los services mapean a DTO dentro de su transaccion; no hace falta mantener la sesion abierta en la vista
spring.jpa.open-in-view=false
